</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const QUESTIONS=[{"id":1,"question":"ข้อใดอธิบาย “สัญญาจ้างแรงงาน” ได้ถูกต้องที่สุด","options":{"A":"สัญญาที่ผู้รับจ้างตกลงทำงานให้สำเร็จโดยอิสระ","B":"สัญญาที่ลูกจ้างตกลงทำงานให้นายจ้าง และนายจ้างตกลงให้สินจ้างตลอดเวลาที่ทำงาน","C":"สัญญาที่ผู้ว่าจ้างจ่ายเงินเฉพาะเมื่อผลงานสำเร็จ","D":"สัญญาที่มุ่งเฉพาะผลสำเร็จของงานเท่านั้น"},"answer":"B","explanation":"สัญญาจ้างแรงงานเน้นความสัมพันธ์ระหว่างลูกจ้างกับนายจ้าง โดยลูกจ้างทำงานให้นายจ้างและนายจ้างให้สินจ้างตลอดเวลาที่ทำงาน"},{"id":2,"question":"บริษัทกำหนดให้พนักงานหยุดประจำสัปดาห์ 1 วัน ข้อใดถูกต้องตามเนื้อหาในบท","options":{"A":"นายจ้างสามารถกำหนดให้งดวันหยุดได้ทั้งหมด","B":"ลูกจ้างต้องหยุดอย่างน้อยสัปดาห์ละ 1 วัน","C":"ลูกจ้างมีสิทธิหยุดได้เฉพาะเดือนละ 1 วัน","D":"วันหยุดประจำสัปดาห์ขึ้นอยู่กับความสมัครใจของลูกจ้างเท่านั้น"},"answer":"B","explanation":"เอกสารกำหนดสิทธิหยุดประจำสัปดาห์ไม่น้อยกว่าสัปดาห์ละ 1 วัน"},{"id":3,"question":"ข้อใดเป็นลักษณะสำคัญของสัญญาจ้างทำของ","options":{"A":"มุ่งถึงระยะเวลาที่ผู้รับจ้างทำงาน","B":"มุ่งถึงความสัมพันธ์ระหว่างนายจ้างกับลูกจ้าง","C":"มุ่งถึงผลสำเร็จของงาน","D":"ต้องมีการควบคุมผู้รับจ้างอย่างใกล้ชิด"},"answer":"C","explanation":"สัญญาจ้างทำของมุ่งที่ผลสำเร็จของงานเป็นสำคัญ"},{"id":4,"question":"นายจ้างสั่งให้ลูกจ้างทำงานตามคำสั่งที่ชอบด้วยกฎหมาย แต่ลูกจ้างจงใจไม่ปฏิบัติตาม ลักษณะนี้เกี่ยวข้องกับข้อใดมากที่สุด","options":{"A":"หน้าที่ของนายจ้าง","B":"หน้าที่ของลูกจ้าง","C":"สิทธิในวันหยุด","D":"สิทธิในค่าชดเชยพิเศษ"},"answer":"B","explanation":"ลูกจ้างมีหน้าที่ปฏิบัติตามและเชื่อฟังคำสั่งของนายจ้างที่ชอบด้วยกฎหมาย"},{"id":5,"question":"ข้อใดไม่ใช่ลักษณะสำคัญของสัญญาจ้างแรงงานตามเอกสาร","options":{"A":"เป็นสัญญาต่างตอบแทน","B":"สาระสำคัญอยู่ที่คู่สัญญา","C":"ไม่มีแบบ","D":"มุ่งผลสำเร็จของงานเป็นสาระสำคัญ"},"answer":"D","explanation":"การมุ่งผลสำเร็จของงานเป็นสาระสำคัญเป็นลักษณะของสัญญาจ้างทำของ"},{"id":6,"question":"บริษัทจ้างช่างให้สร้างโต๊ะจำนวน 100 ตัว โดยตกลงจ่ายเงินเมื่อโต๊ะทั้งหมดสร้างเสร็จตามที่กำหนด ลักษณะนี้ใกล้เคียงกับสัญญาประเภทใดมากที่สุด","options":{"A":"สัญญาจ้างแรงงาน","B":"สัญญาจ้างทำของ","C":"สัญญาฝึกงาน","D":"สัญญาจ้างทดลองงาน"},"answer":"B","explanation":"โจทย์เน้นผลสำเร็จของงาน คือโต๊ะ 100 ตัว จึงเข้าลักษณะสัญญาจ้างทำของ"},{"id":7,"question":"ข้อใดเป็นสิทธิของลูกจ้างเกี่ยวกับ “วันหยุดตามประเพณี” ตามเอกสาร","options":{"A":"ไม่น้อยกว่า 5 วันต่อปี","B":"ไม่น้อยกว่า 6 วันต่อปี","C":"ไม่น้อยกว่า 13 วันต่อปี","D":"ไม่น้อยกว่า 15 วันต่อปี"},"answer":"C","explanation":"เอกสารกำหนดวันหยุดตามประเพณีไม่น้อยกว่าปีละ 13 วัน และรวมวันแรงงานแห่งชาติ"},{"id":8,"question":"นายจ้างจ่ายเงินให้พนักงานเป็น “ค่าน้ำมันรถสำหรับใช้เดินทางไปทำงาน” โดยไม่ได้จ่ายเพื่อเป็นการตอบแทนการทำงานโดยตรง จากเนื้อหาในบท เงินดังกล่าวมีลักษณะอย่างไร","options":{"A":"ถือเป็นค่าจ้างเสมอ","B":"ไม่ถือเป็นค่าจ้างตามตัวอย่างในเอกสาร","C":"ถือเป็นค่าชดเชย","D":"ถือเป็นสินจ้างแทนการบอกกล่าวล่วงหน้า"},"answer":"B","explanation":"เอกสารยกตัวอย่างว่าค่าน้ำมันรถที่จ่ายเพื่อใช้ในการทำงาน ไม่ใช่เงินที่จ่ายเพื่อตอบแทนการทำงาน จึงไม่ใช่ค่าจ้าง"},{"id":9,"question":"ข้อใดเป็นหน้าที่ของนายจ้างตามเนื้อหาในบท","options":{"A":"ต้องทำงานด้วยตนเอง","B":"ต้องรักษาความลับของนายจ้าง","C":"ต้องให้สินจ้างแก่ลูกจ้าง","D":"ต้องจัดหาเครื่องมือให้ผู้รับจ้างทุกกรณี"},"answer":"C","explanation":"นายจ้างมีหน้าที่ให้สินจ้างแก่ลูกจ้าง"},{"id":10,"question":"ลูกจ้างคนหนึ่งทำงานครบ 120 วัน แล้วถูกนายจ้างเลิกจ้างโดยไม่ได้กระทำความผิด ตามหลักเรื่องค่าชดเชย ลูกจ้างมีสิทธิได้รับค่าชดเชยขั้นต่ำเท่าใดตามเนื้อหาที่เรียน","options":{"A":"ค่าจ้าง 15 วัน","B":"ค่าจ้าง 20 วัน","C":"ค่าจ้าง 30 วัน","D":"ค่าจ้าง 60 วัน"},"answer":"C","explanation":"เอกสารระบุว่าทำงานติดต่อกันครบ 120 วันขึ้นไป มีสิทธิได้รับค่าชดเชยไม่น้อยกว่า 30 วัน"},{"id":11,"question":"ข้อใดแสดงความแตกต่างระหว่าง “จ้างแรงงาน” กับ “จ้างทำของ” ได้ชัดเจนที่สุด","options":{"A":"ทั้งสองสัญญาต้องมุ่งผลสำเร็จของงานเหมือนกัน","B":"จ้างแรงงานเน้นระยะเวลาการทำงาน ส่วนจ้างทำของเน้นผลสำเร็จของงาน","C":"จ้างแรงงานไม่มีค่าตอบแทน แต่จ้างทำของมีค่าตอบแทน","D":"จ้างทำของต้องอยู่ภายใต้คำสั่งของผู้ว่าจ้างตลอดเวลา"},"answer":"B","explanation":"จ้างแรงงานคำนึงถึงการทำงานและความสัมพันธ์กับนายจ้าง ส่วนจ้างทำของมุ่งผลสำเร็จของงาน"},{"id":12,"question":"หากนายจ้างไม่จ่ายค่าจ้างที่ค้างชำระ ลูกจ้างมีสิทธิใดตามเนื้อหาในบท","options":{"A":"เรียกร้องค่าจ้างที่ค้างชำระและดอกเบี้ยตามกฎหมาย","B":"เรียกร้องเฉพาะวันหยุด","C":"เรียกร้องเฉพาะค่าชดเชยพิเศษ","D":"ไม่มีสิทธิเรียกร้องหากยังทำงานอยู่"},"answer":"A","explanation":"ลูกจ้างมีสิทธิเรียกร้องค่าจ้างที่ค้างชำระ รวมถึงดอกเบี้ยตามกฎหมาย"},{"id":13,"question":"ผู้รับจ้างในสัญญาจ้างทำของมีอิสระในการทำงานมากกว่าลูกจ้าง เพราะเหตุใด","options":{"A":"ผู้รับจ้างไม่ต้องทำงานให้เสร็จ","B":"ผู้รับจ้างไม่ต้องรับสินจ้าง","C":"ผู้รับจ้างไม่ได้อยู่ภายใต้การควบคุมบังคับบัญชาของผู้ว่าจ้าง","D":"ผู้รับจ้างไม่ต้องรับผิดชอบต่อผลงาน"},"answer":"C","explanation":"ผู้รับจ้างไม่ได้อยู่ภายใต้การควบคุมบังคับบัญชา เพียงต้องทำงานให้สำเร็จ"},{"id":14,"question":"ลูกจ้างต้องทำงานด้วยตนเองและไม่สามารถให้บุคคลอื่นมาทำแทนได้ เว้นแต่นายจ้างยินยอม หลักนี้สะท้อนลักษณะใดของสัญญาจ้างแรงงาน","options":{"A":"สาระสำคัญอยู่ที่ตัวคู่สัญญา","B":"มุ่งผลสำเร็จของงาน","C":"ไม่มีค่าตอบแทน","D":"เป็นสัญญาที่ไม่ต่างตอบแทน"},"answer":"A","explanation":"สัญญาจ้างแรงงานมีสาระสำคัญอยู่ที่ตัวคู่สัญญา"},{"id":15,"question":"ลูกจ้างต้องการใช้วันหยุดพักผ่อนประจำปี ตามเนื้อหาในเอกสาร ลูกจ้างมีสิทธิขั้นต่ำเท่าใด","options":{"A":"3 วันทำงานต่อปี","B":"5 วันทำงานต่อปี","C":"6 วันทำงานต่อปี","D":"10 วันทำงานต่อปี"},"answer":"C","explanation":"เอกสารกำหนดวันหยุดพักผ่อนประจำปีไม่น้อยกว่าปีละ 6 วันทำงาน"},{"id":16,"question":"ผู้รับจ้างได้รับวัสดุจากผู้ว่าจ้างเพื่อใช้สร้างสินค้า ผู้รับจ้างควรปฏิบัติอย่างไร","options":{"A":"ใช้โดยไม่ต้องคำนึงถึงความเสียหาย","B":"ใช้ด้วยความระมัดระวังและประหยัด และคืนส่วนที่เหลือ","C":"นำวัสดุที่เหลือไปใช้ส่วนตัวได้","D":"เปลี่ยนวัสดุทั้งหมดโดยไม่ต้องแจ้งผู้ว่าจ้าง"},"answer":"B","explanation":"ผู้รับจ้างต้องใช้สัมภาระของผู้ว่าจ้างด้วยความระมัดระวังและประหยัด และคืนส่วนที่เหลือ"},{"id":17,"question":"ข้อใดเป็นตัวอย่างของ “สัญญาจ้างแรงงาน” มากที่สุด","options":{"A":"จ้างบริษัทสร้างอาคารให้เสร็จภายใน 1 ปี","B":"จ้างช่างทำโต๊ะ 50 ตัว","C":"จ้างพนักงานบัญชีให้ทำงานกับบริษัทและได้รับเงินเดือนทุกเดือน","D":"จ้างศิลปินวาดภาพหนึ่งภาพโดยจ่ายเงินเมื่อภาพเสร็จ"},"answer":"C","explanation":"พนักงานบัญชีทำงานให้บริษัทและได้รับเงินเดือน จึงเป็นตัวอย่างของสัญญาจ้างแรงงาน"},{"id":18,"question":"ข้อใดเป็นข้อยกเว้นที่นายจ้างสามารถหักค่าตอบแทนในการทำงานได้ตามเนื้อหา","options":{"A":"นายจ้างต้องการลงโทษลูกจ้าง","B":"นายจ้างไม่ชอบผลงานของลูกจ้าง","C":"ชำระภาษีเงินได้หรือเงินอื่นตามที่กฎหมายกำหนด","D":"นายจ้างต้องการลดต้นทุนบริษัท"},"answer":"C","explanation":"การหักค่าตอบแทนทำได้เฉพาะกรณีที่กฎหมายกำหนด เช่น ชำระภาษีเงินได้"},{"id":19,"question":"ถ้าผู้ว่าจ้างเป็นผู้จัดหาสัมภาระให้ผู้รับจ้าง ผู้รับจ้างมีหน้าที่อย่างไร","options":{"A":"ใช้สัมภาระอย่างไรก็ได้","B":"ใช้ด้วยความระมัดระวังและประหยัด และคืนส่วนที่เหลือ","C":"ต้องซื้อสัมภาระใหม่ทั้งหมด","D":"ไม่ต้องรับผิดชอบใด ๆ ต่อสัมภาระ"},"answer":"B","explanation":"ผู้รับจ้างต้องใช้สัมภาระอย่างระมัดระวังและประหยัด และคืนส่วนที่เหลือ"},{"id":20,"question":"ข้อใดกล่าวถึง “มาตรา 118” ได้ตรงกับหัวข้อที่กำลังศึกษา","options":{"A":"การกำหนดวันหยุดประจำสัปดาห์","B":"การกำหนดค่าชดเชยเมื่อมีการเลิกจ้าง","C":"การจัดตั้งสหภาพแรงงาน","D":"การกำหนดเวลาพักระหว่างการทำงาน"},"answer":"B","explanation":"มาตรา 118 เป็นหลักสำคัญเรื่องอัตราค่าชดเชยเมื่อมีการเลิกจ้าง"},{"id":21,"question":"บริษัทแห่งหนึ่งกำหนดวันหยุดตามประเพณีปีละ 10 วัน โดยไม่นับวันแรงงานแห่งชาติ ข้อใดวิเคราะห์ได้ถูกต้องที่สุดจากหลักที่เรียน","options":{"A":"ถูกต้อง เพราะนายจ้างกำหนดเองได้","B":"ถูกต้อง เพราะวันแรงงานไม่ถือเป็นวันหยุด","C":"ไม่สอดคล้องกับหลักที่กำหนดวันหยุดตามประเพณีไม่น้อยกว่า 13 วัน และรวมวันแรงงานแห่งชาติ","D":"ไม่สอดคล้องเฉพาะกรณีที่ลูกจ้างเป็นรายเดือน"},"answer":"C","explanation":"ตามเอกสาร วันหยุดตามประเพณีต้องไม่น้อยกว่าปีละ 13 วัน และรวมวันแรงงานแห่งชาติ"},{"id":22,"question":"ผู้รับจ้างทำงานล่าช้า แต่ความล่าช้านั้นเกิดจากผู้ว่าจ้างไม่ส่งวัสดุให้ตามเวลาที่ตกลงกัน ผู้รับจ้างควรรับผิดในความล่าช้าหรือไม่","options":{"A":"ต้องรับผิดทุกกรณี","B":"ไม่ต้องรับผิด หากความล่าช้าเกิดจากความผิดของผู้ว่าจ้าง","C":"ต้องจ่ายค่าปรับให้ผู้ว่าจ้างเสมอ","D":"ต้องคืนค่าจ้างทั้งหมด"},"answer":"B","explanation":"ผู้รับจ้างรับผิดในความล่าช้า เว้นแต่ความล่าช้านั้นเกิดจากความผิดของผู้ว่าจ้าง"},{"id":23,"question":"ข้อใดเป็นหน้าที่ของลูกจ้างที่เกี่ยวข้องกับ “ความซื่อสัตย์สุจริต”","options":{"A":"สามารถเปิดเผยความลับของนายจ้างได้","B":"ต้องรักษาความลับในการงานของนายจ้าง","C":"สามารถให้บุคคลอื่นทำงานแทนโดยไม่ต้องขออนุญาต","D":"ไม่จำเป็นต้องปฏิบัติตามคำสั่งใด ๆ"},"answer":"B","explanation":"ลูกจ้างต้องปฏิบัติงานด้วยความซื่อสัตย์สุจริตและรักษาความลับในการงาน"},{"id":24,"question":"หากผู้รับจ้างทำงานเสร็จแล้วส่งมอบงาน และได้รับค่าจ้างครบถ้วน สัญญาจ้างทำของย่อมมีลักษณะอย่างไร","options":{"A":"สัญญายังไม่มีทางระงับ","B":"สัญญาระงับลงได้ตามหลักในเอกสาร","C":"ต้องต่อสัญญาใหม่เสมอ","D":"ผู้รับจ้างต้องทำงานต่ออีก 30 วัน"},"answer":"B","explanation":"การทำงานเสร็จ ส่งมอบงาน และได้รับค่าจ้างครบถ้วน เป็นเหตุให้สัญญาจ้างทำของระงับ"},{"id":25,"question":"ข้อใดเป็นลักษณะของสัญญาจ้างทำของที่แตกต่างจากสัญญาจ้างแรงงานอย่างชัดเจน","options":{"A":"มีคู่สัญญา 2 ฝ่าย","B":"เป็นสัญญาต่างตอบแทน","C":"ผู้รับจ้างไม่ต้องอยู่ภายใต้การบังคับบัญชาของผู้ว่าจ้าง","D":"มีการจ่ายสินจ้าง"},"answer":"C","explanation":"ผู้รับจ้างทำของมีอิสระ ไม่อยู่ภายใต้การบังคับบัญชาแบบลูกจ้าง"},{"id":26,"question":"นายจ้างให้ลูกจ้างทำงานล่วงเวลาจากเวลาทำงานปกติ ตามหลักค่าตอบแทนในบท ลูกจ้างควรได้รับค่าล่วงเวลาอย่างน้อยในอัตราใด","options":{"A":"1 เท่า","B":"1.5 เท่า","C":"2 เท่า","D":"3 เท่า"},"answer":"B","explanation":"เอกสารสรุปค่าล่วงเวลาไว้ไม่น้อยกว่า 1.5 เท่า"},{"id":27,"question":"ลูกจ้างทำงานในวันหยุดเกินเวลาทำงานปกติ อัตราค่าล่วงเวลาในวันหยุดตามเนื้อหาที่เรียนคือเท่าใด","options":{"A":"1 เท่า","B":"1.5 เท่า","C":"2 เท่า","D":"3 เท่า"},"answer":"D","explanation":"เอกสารสรุปค่าล่วงเวลาในวันหยุดไว้ไม่น้อยกว่า 3 เท่า"},{"id":28,"question":"ผู้รับจ้างส่งมอบงานแล้ว แต่ภายหลังพบความชำรุดบกพร่องภายในระยะเวลาที่กฎหมายกำหนด ตามเนื้อหาในบท ผู้รับจ้างอาจต้องรับผิดในความชำรุดบกพร่องดังกล่าว ข้อใดถูกต้อง","options":{"A":"ภายใน 1 ปี และสิ่งปลูกสร้างบนพื้นดินภายใน 5 ปี","B":"ภายใน 30 วันทุกกรณี","C":"ภายใน 3 เดือนทุกกรณี","D":"ไม่มีความรับผิดหลังส่งมอบงาน"},"answer":"A","explanation":"เอกสารระบุความรับผิดในความชำรุดบกพร่องที่ปรากฏภายใน 1 ปี หรือ 5 ปีสำหรับสิ่งปลูกสร้างบนพื้นดิน"},{"id":29,"question":"ข้อใดเป็นเหตุที่นายจ้างอาจเลิกจ้างลูกจ้างโดยไม่ต้องบอกกล่าวล่วงหน้าตามตัวอย่างในเอกสาร","options":{"A":"ลูกจ้างขอลาพักผ่อนประจำปี","B":"ลูกจ้างจงใจขัดคำสั่งอันชอบด้วยกฎหมายของนายจ้าง","C":"ลูกจ้างใช้วันหยุดประจำสัปดาห์","D":"ลูกจ้างขอรับค่าจ้างตามสัญญา"},"answer":"B","explanation":"การจงใจขัดคำสั่งอันชอบด้วยกฎหมายเป็นหนึ่งในตัวอย่างการไม่ทำตามหน้าที่ที่อาจนำไปสู่การเลิกจ้างโดยไม่ต้องบอกกล่าวล่วงหน้า"},{"id":30,"question":"ลูกจ้างถูกเลิกจ้างหลังจากทำงานติดต่อกันครบ 120 วัน โดยไม่ได้กระทำความผิดที่เป็นข้อยกเว้น หลักสำคัญที่ควรนำมาพิจารณาคือข้อใด","options":{"A":"วันหยุดตามประเพณี","B":"มาตรา 118 เรื่องค่าชดเชย","C":"การจัดตั้งสหภาพแรงงาน","D":"หน้าที่ของผู้รับจ้างทำของ"},"answer":"B","explanation":"สถานการณ์เป็นการเลิกจ้างหลังครบ 120 วัน จึงต้องพิจารณาหลักค่าชดเชยตามมาตรา 118"},{"id":31,"question":"ข้อใดเป็นลักษณะสำคัญของ “สัญญาต่างตอบแทน”","options":{"A":"มีเพียงฝ่ายเดียวที่มีหน้าที่","B":"คู่สัญญาต่างมีหน้าที่ตอบแทนซึ่งกันและกัน","C":"ไม่มีการจ่ายสินจ้าง","D":"ต้องเป็นสัญญาจ้างทำของเท่านั้น"},"answer":"B","explanation":"สัญญาต่างตอบแทนคือคู่สัญญาต่างมีหน้าที่ตอบแทนกัน"},{"id":32,"question":"กลุ่มลูกจ้างที่เกี่ยวข้องกับข้อเรียกร้องจะยื่นข้อเรียกร้องเป็นหนังสือต่อนายจ้างได้ หากมีจำนวนไม่น้อยกว่าร้อยละเท่าใดของลูกจ้างที่เกี่ยวข้องกับข้อเรียกร้อง","options":{"A":"5%","B":"10%","C":"15%","D":"20%"},"answer":"C","explanation":"เอกสารระบุว่ากลุ่มลูกจ้างไม่น้อยกว่าร้อยละ 15 สามารถยื่นข้อเรียกร้องเป็นหนังสือได้"},{"id":33,"question":"หากผู้รับจ้างตาย และสาระสำคัญของสัญญาอยู่ที่ความรู้ความสามารถเฉพาะตัวของผู้รับจ้าง สัญญาจ้างทำของอาจเป็นอย่างไร","options":{"A":"ต้องดำเนินต่อโดยบุคคลอื่นเสมอ","B":"สัญญาอาจระงับตามหลักที่กำหนด","C":"ผู้ว่าจ้างต้องจ่ายเงินเต็มจำนวนโดยไม่คำนึงถึงงาน","D":"ผู้รับจ้างคนใหม่ต้องเข้าทำงานแทนโดยอัตโนมัติ"},"answer":"B","explanation":"เอกสารระบุว่าสัญญาอาจระงับเมื่อผู้รับจ้างตายหรือไม่สามารถทำงานได้ หากสาระสำคัญอยู่ที่ความรู้ความสามารถของผู้รับจ้าง"},{"id":34,"question":"บริษัทต้องการลดจำนวนลูกจ้างเนื่องจากการนำเครื่องจักรหรือเทคโนโลยีมาใช้ สิ่งใดเป็นประเด็นที่เกี่ยวข้องกับ “ค่าชดเชยพิเศษ”","options":{"A":"เป็นเพียงเรื่องวันหยุดประจำสัปดาห์","B":"เป็นกรณีที่อาจมีสิทธิได้รับค่าชดเชยพิเศษเพิ่มเติม","C":"ไม่มีความเกี่ยวข้องกับกฎหมายแรงงาน","D":"ลูกจ้างต้องลาออกเองเท่านั้น"},"answer":"B","explanation":"เอกสารมีหัวข้อความคุ้มครองเกี่ยวกับค่าชดเชยพิเศษกรณีการเปลี่ยนแปลงเครื่องจักรหรือเทคโนโลยี"},{"id":35,"question":"ข้อใดเป็นการปฏิบัติที่ไม่สอดคล้องกับหน้าที่ของลูกจ้าง","options":{"A":"ปฏิบัติตามคำสั่งที่ชอบด้วยกฎหมาย","B":"รักษาความลับในการงาน","C":"ทำงานด้วยตนเองตามที่ตกลง","D":"เปิดเผยข้อมูลลับของนายจ้างให้คู่แข่งโดยเจตนา"},"answer":"D","explanation":"การเปิดเผยความลับของนายจ้างขัดกับหน้าที่ในการรักษาความลับ"},{"id":36,"question":"นายจ้างย้ายสถานประกอบกิจการไปยังสถานที่ใหม่จนมีผลกระทบสำคัญต่อการดำรงชีวิตของลูกจ้าง และลูกจ้างไม่ประสงค์ย้ายตาม กรณีนี้เกี่ยวข้องกับเรื่องใดมากที่สุด","options":{"A":"ค่าจ้างขั้นต่ำ","B":"ค่าชดเชยพิเศษ","C":"วันหยุดพักผ่อนประจำปี","D":"เงินสะสม"},"answer":"B","explanation":"เอกสารกล่าวถึงค่าชดเชยพิเศษกรณีนายจ้างย้ายสถานประกอบกิจการและลูกจ้างไม่ประสงค์ย้ายตามเมื่อเข้าเงื่อนไข"},{"id":37,"question":"ข้อใดกล่าวถูกต้องเกี่ยวกับการจ่ายสินจ้างของสัญญาจ้างทำของ","options":{"A":"ต้องคำนวณจากจำนวนวันที่ผู้รับจ้างมาทำงานเสมอ","B":"มุ่งพิจารณาตามผลของงานที่ได้","C":"ไม่มีความเกี่ยวข้องกับผลสำเร็จของงาน","D":"ผู้ว่าจ้างไม่ต้องจ่ายสินจ้าง"},"answer":"B","explanation":"จ้างทำของมุ่งผลสำเร็จของงาน และสินจ้างสัมพันธ์กับผลของงานที่ได้"},{"id":38,"question":"ลูกจ้างทำงานให้นายจ้าง แต่ได้รับเงินตอบแทนเป็นทรัพย์สินแทนเงินตราได้หรือไม่ตามหลักในบท","options":{"A":"ไม่ได้เด็ดขาด","B":"ได้ เพราะสินจ้างอาจเป็นเงินตราหรือทรัพย์สินอย่างอื่นก็ได้","C":"ได้เฉพาะสัญญาจ้างทำของ","D":"ได้เฉพาะกรณีไม่มีสัญญา"},"answer":"B","explanation":"สินจ้างอาจเป็นเงินตราหรือทรัพย์สินอย่างอื่นได้ หากเป็นการตอบแทนการทำงาน"},{"id":39,"question":"นายจ้างมีลูกจ้างที่ทำงานมาแล้วหลายปี และต้องการเลิกจ้างโดยไม่มีความผิดของลูกจ้าง สิ่งใดควรนำมาพิจารณาเป็นสำคัญในการคำนวณค่าชดเชย","options":{"A":"อายุของนายจ้าง","B":"อายุของลูกจ้าง","C":"ระยะเวลาที่ลูกจ้างทำงานและหลักเกณฑ์ค่าชดเชย","D":"จำนวนวันหยุดในเดือนสุดท้ายเท่านั้น"},"answer":"C","explanation":"การคำนวณค่าชดเชยต้องพิจารณาระยะเวลาการทำงานตามเกณฑ์ค่าชดเชย"},{"id":40,"question":"หากลูกจ้างลาออกจากงานด้วยตนเอง ข้อใดเป็นการวิเคราะห์ที่เหมาะสมที่สุดเกี่ยวกับค่าชดเชย","options":{"A":"มีสิทธิได้รับค่าชดเชยเสมอ","B":"การลาออกเองเป็นกรณีที่โดยหลักไม่ใช่การเลิกจ้างโดยนายจ้างเพื่อให้เกิดสิทธิค่าชดเชย","C":"ได้รับค่าชดเชย 400 วันเสมอ","D":"ได้รับค่าชดเชยเท่ากับวันหยุดประจำปี"},"answer":"B","explanation":"หลักค่าชดเชยตามมาตรา 118 ใช้กับกรณีเลิกจ้างตามเงื่อนไขของกฎหมาย การลาออกเองจึงไม่ใช่กรณีเดียวกัน"},{"id":41,"question":"หากผู้ว่าจ้างต้องการตรวจตราการงานของผู้รับจ้าง ข้อใดถูกต้องตามหน้าที่ของผู้รับจ้างในบท","options":{"A":"ผู้รับจ้างต้องยอมให้ผู้ว่าจ้างหรือตัวแทนตรวจตราการงาน","B":"ผู้รับจ้างสามารถปฏิเสธทุกกรณี","C":"ผู้ว่าจ้างไม่มีสิทธิตรวจงานใด ๆ","D":"ต้องตรวจเฉพาะเมื่อทำงานเสร็จแล้วเท่านั้น"},"answer":"A","explanation":"เอกสารกำหนดให้ผู้รับจ้างต้องยอมให้ผู้ว่าจ้างหรือตัวแทนตรวจตราการงาน"},{"id":42,"question":"ข้อใดเป็นตัวอย่างที่สะท้อน “ความเป็นสัญญาเฉพาะตัว” ของสัญญาจ้างแรงงานได้ดีที่สุด","options":{"A":"นายจ้างตกลงจ้างบุคคลหนึ่งเพราะต้องการความรู้ความสามารถของบุคคลนั้น","B":"บริษัทซื้อสินค้าจากโรงงาน","C":"บริษัทจ้างผู้รับเหมาสร้างอาคารโดยไม่สนใจว่าใครเป็นผู้ทำ","D":"บริษัทซื้อเครื่องจักรจากผู้ขาย"},"answer":"A","explanation":"สัญญาจ้างแรงงานให้ความสำคัญกับตัวคู่สัญญาและการทำงานของบุคคลนั้น"},{"id":43,"question":"หากนายจ้างและลูกจ้างมีสัญญาจ้างแรงงานที่สมบูรณ์ ลูกจ้างย่อมได้รับความคุ้มครองจากกฎหมายหลายด้าน ข้อใดไม่ใช่กฎหมายที่กล่าวถึงในเอกสาร","options":{"A":"กฎหมายแพ่งและพาณิชย์","B":"กฎหมายคุ้มครองแรงงาน","C":"กฎหมายแรงงานสัมพันธ์","D":"กฎหมายจราจรทางบก"},"answer":"D","explanation":"เอกสารกล่าวถึงกฎหมายแพ่งและพาณิชย์ กฎหมายคุ้มครองแรงงาน กฎหมายแรงงานสัมพันธ์ และกฎหมายวิธีพิจารณาคดีแรงงาน"},{"id":44,"question":"ลูกจ้างมีอาการเจ็บป่วยและจำเป็นต้องหยุดงาน กรณีนี้อยู่ในหมวดสิทธิใด","options":{"A":"วันหยุด","B":"วันลา","C":"ค่าชดเชยพิเศษ","D":"แรงงานสัมพันธ์"},"answer":"B","explanation":"การเจ็บป่วยและหยุดงานอยู่ในหมวดวันลา"},{"id":45,"question":"บริษัทแห่งหนึ่งหักเงินเดือนลูกจ้างเพื่อชดใช้ความเสียหายที่ลูกจ้างจงใจทำให้บริษัทเสียหาย การหักดังกล่าวจะสอดคล้องกับหลักในบทเมื่อใด","options":{"A":"หักได้โดยไม่ต้องมีเงื่อนไข","B":"หักได้ตามหลักเกณฑ์และกรณีที่กฎหมายกำหนด โดยมีความยินยอมตามที่กำหนด","C":"หักได้เฉพาะเมื่อเป็นความเสียหายเล็กน้อย","D":"หักได้เพราะนายจ้างเป็นเจ้าของกิจการ"},"answer":"B","explanation":"การหักเพื่อชดใช้ความเสียหายต้องอยู่ภายใต้เงื่อนไขและความยินยอมตามที่กฎหมายกำหนด"},{"id":46,"question":"หากข้อเรียกร้องเกี่ยวกับสภาพการจ้างไม่สามารถตกลงกันได้ และเกิดข้อพิพาทแรงงานขึ้น สิ่งใดเป็นแนวทางที่กล่าวถึงในเนื้อหา","options":{"A":"ลูกจ้างอาจนัดหยุดงาน และนายจ้างอาจปิดงาน","B":"ลูกจ้างต้องลาออกทั้งหมด","C":"นายจ้างต้องยุบสหภาพแรงงาน","D":"ลูกจ้างไม่มีสิทธิทำอะไร"},"answer":"A","explanation":"เอกสารกล่าวถึงการนัดหยุดงานของลูกจ้างและการปิดงานของนายจ้าง"},{"id":47,"question":"ข้อใดแสดงความแตกต่างด้าน “การควบคุมบังคับบัญชา” ได้ถูกต้องที่สุด","options":{"A":"ลูกจ้างและผู้รับจ้างต่างต้องอยู่ภายใต้คำสั่งนายจ้างเหมือนกัน","B":"ลูกจ้างอยู่ภายใต้การบังคับบัญชาของนายจ้าง ส่วนผู้รับจ้างมุ่งทำงานให้สำเร็จโดยมีอิสระมากกว่า","C":"ผู้รับจ้างต้องทำตามคำสั่งทุกเรื่องมากกว่าลูกจ้าง","D":"ไม่มีความแตกต่าง"},"answer":"B","explanation":"ลูกจ้างทำงานภายใต้การบังคับบัญชาของนายจ้าง ส่วนผู้รับจ้างทำงานให้สำเร็จโดยมีอิสระมากกว่า"},{"id":48,"question":"หากนายจ้างละเมิดสิทธิของลูกจ้างในการใช้สิทธิตามกฎหมายแรงงานสัมพันธ์ เช่น ขัดขวางการใช้สิทธิอย่างไม่เป็นธรรม ประเด็นนี้เกี่ยวข้องกับเรื่องใด","options":{"A":"การปฏิบัติทางการค้าที่ไม่เป็นธรรม","B":"การกระทำอันไม่เป็นธรรมในแรงงานสัมพันธ์","C":"สัญญาจ้างทำของ","D":"ค่าจ้างตามผลงาน"},"answer":"B","explanation":"การขัดขวางหรือโต้ตอบลูกจ้างจากการใช้สิทธิตามกฎหมายแรงงานสัมพันธ์เป็นประเด็นเรื่องการกระทำอันไม่เป็นธรรม"},{"id":49,"question":"สถานการณ์ใดต่อไปนี้มีลักษณะเป็น “สัญญาจ้างทำของ” มากที่สุด","options":{"A":"บริษัทจ้างพนักงานขายประจำและจ่ายเงินเดือนทุกเดือน","B":"บริษัทจ้างพนักงาน HR ทำงานตามเวลาที่บริษัทกำหนด","C":"บริษัทจ้างช่างออกแบบและสร้างป้ายร้านให้เสร็จตามแบบที่กำหนด โดยชำระเงินเมื่อผลงานเสร็จ","D":"บริษัทรับพนักงานบัญชีเข้าทำงานประจำ"},"answer":"C","explanation":"โจทย์มุ่งผลสำเร็จของงาน คือป้ายร้านที่ต้องทำให้เสร็จตามแบบ"},{"id":50,"question":"บริษัท A จ้างนายบีเป็นพนักงานประจำ นายบีได้รับเงินเดือนและต้องปฏิบัติตามคำสั่งของบริษัท ต่อมาบริษัทเลิกจ้างนายบีหลังทำงานครบ 120 วัน โดยนายบีไม่ได้กระทำความผิด นอกจากนี้บริษัทมีการหักเงินเดือนนายบีเพื่อเป็นค่าปรับโดยไม่มีฐานตามข้อยกเว้นที่กฎหมายกำหนด\n\nจากสถานการณ์นี้ ข้อใดวิเคราะห์ได้ถูกต้องที่สุด","options":{"A":"บริษัททำได้ทั้งสองเรื่อง เพราะนายจ้างมีอำนาจเหนือกว่าลูกจ้าง","B":"บริษัทอาจมีประเด็นเกี่ยวกับทั้งสิทธิค่าชดเชยจากการเลิกจ้าง และข้อจำกัดในการหักค่าตอบแทน","C":"นายบีไม่มีสิทธิใด ๆ เพราะบริษัทเป็นผู้จ่ายเงินเดือน","D":"เรื่องทั้งหมดถือเป็นสัญญาจ้างทำของ จึงไม่เกี่ยวกับกฎหมายคุ้มครองแรงงาน"},"answer":"B","explanation":"ต้องแยก 2 ประเด็น: การเลิกจ้างหลังครบ 120 วันเกี่ยวข้องกับสิทธิค่าชดเชย และการหักเงินเดือนต้องอยู่ภายใต้ข้อยกเว้นตามกฎหมาย"}];</script><script src="app.js?v=20261008-3"></script></body></html>
