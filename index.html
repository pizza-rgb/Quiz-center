<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Center</title>
<style>
:root{--ink:#22253a;--muted:#6e7285;--line:#e3e6ef;--soft:#f5f6fb;--accent:#6557d9;--danger:#b42318;--good:#147d46}*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:20px max(18px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;gap:16px;align-items:center}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:14px}#account{font-size:13px;color:var(--accent);cursor:pointer;overflow-wrap:anywhere}main{max-width:1000px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.hidden{display:none!important}h2{margin:0 0 8px;font-size:22px}h3{margin:6px 0;font-size:18px}p{line-height:1.55}.muted{color:var(--muted)}label{display:block;font-size:14px;margin:12px 0 6px}input,textarea,select{display:block;width:100%;border:1px solid #cfd3e0;border-radius:10px;padding:12px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:220px;font-family:ui-monospace,monospace;font-size:13px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px}.primary{background:var(--accent);color:white;font-weight:650}.ghost{background:#eeeff8;color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.tabs .active{background:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;text-align:left;width:100%;color:var(--ink)}.tile:hover{border-color:#b8b0ff}.tile p{color:var(--muted);font-size:14px;margin:6px 0}.notice{background:#fff7dc;padding:12px;border-radius:10px;margin-top:12px;font-size:14px;overflow-wrap:anywhere}.error{color:var(--danger)}.success{color:var(--good)}.options{display:grid;gap:10px;margin:18px 0}.option{display:flex;gap:10px;text-align:left;background:white;border:1px solid var(--line);width:100%;align-items:flex-start}.option.selected{border-color:var(--accent);background:#f2f0ff}.option.correct{border-color:#4aaf79;background:#effaf3}.option.wrong{border-color:#e67d7d;background:#fff2f2}.letter{font-weight:800;min-width:25px}.progress{height:8px;background:#e8eaf2;border-radius:99px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--accent)}.admin-box{border:1px solid var(--line);background:#fafaff;border-radius:14px;padding:18px;margin-top:14px}.feedback{padding:14px;border-radius:10px;background:#f5f6fb;margin:12px 0}.feedback.good{background:#effaf3}.feedback.bad{background:#fff2f2}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding:16px;align-items:flex-start}header h1{font-size:19px}.card{padding:16px}}
</style>
</head>
<body>
<header><div><h1 id="pageTitle">Quiz Center</h1><p id="pageSubtitle">ศูนย์รวมแบบทดสอบ</p></div><div id="account">ยังไม่ได้เข้าสู่ระบบ</div></header>
<main>
<section id="auth" class="card"><h2>เข้าสู่ Quiz Center</h2><div class="tabs"><button type="button" id="learnerTab" class="primary active">ผู้เรียน</button><button type="button" id="adminTab" class="ghost">แอดมิน</button></div>
<form id="authForm"><div id="emailWrap"><label for="email">อีเมลผู้เรียน</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com" required></div><div id="adminIdentityWrap" class="hidden"><label>บัญชีแอดมิน</label><p id="adminIdentity" class="muted">29jul2005@gmail.com</p></div><div id="passwordWrap" class="hidden"><label for="password">รหัสผ่านแอดมิน</label><input id="password" type="password" autocomplete="current-password"></div><button id="authSubmit" class="primary" type="submit" style="margin-top:14px">เข้าสู่ระบบ</button></form><div id="authMsg" class="notice hidden" role="status"></div></section>
<section id="subjects" class="card hidden"></section>
<section id="quiz" class="card hidden"><div class="row" style="justify-content:space-between"><button id="quizBack" class="ghost" type="button">← กลับ</button><span id="qnum" class="small"></span></div><p id="progressText" class="muted"></p><div class="progress"><div id="bar" style="width:0"></div></div><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback hidden"><strong id="fbtitle"></strong><p id="explanation"></p></div><div class="row"><button id="submit" class="primary" type="button">ส่งคำตอบ</button><button id="next" class="primary hidden" type="button">ข้อถัดไป →</button><button id="reset" class="ghost" type="button">เริ่มชุดนี้ใหม่</button></div><span id="badge" class="small"></span></section>
<section id="result" class="card hidden"><h2>ผลคะแนน</h2><h3 id="score"></h3><p id="resultText"></p><div class="row"><button id="resultBack" class="ghost" type="button">← กลับไปเลือกบท</button><button id="retake" class="primary" type="button">ทำใหม่</button><button id="review" class="ghost" type="button">ทบทวนข้อแรก</button></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261010-2"></script>
<script src="app.js?v=20261010-3"></script>
</body></html>
